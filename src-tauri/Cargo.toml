[package]
name = "etcd-gui"
version = "1.0.0"
description = "A Tauri App"
authors = ["Evanescentum"]
edition = "2024"
repository = "https://github.com/evanescentum/etcd-gui"
default-run = "etcd-gui"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "etcd_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "seed"
path = "src/bin/seed.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.10.3", features = ["devtools"] }
tauri-plugin-opener = "2.5.3"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-log = { version = "2.7.1", features = ["colored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.46.0", features = ["full"] }
tokio-util = "0.7.14"
etcd-client = { version = "0.15.0", features = ["tls"] }
tonic = { version = "0.12" }
log = "0.4.28"
font-kit = "0.14.2"
semver = { version = "1", features = ["serde"] }
strum = { version = "0.27", features = ["derive"] }
octocrab = { version = "0.49.5" }
parking_lot = { version = "0.12" }
#XXX stay in 0.12 to keep using `ring` as the backend of `rustls`
reqwest = { version = "0.12", features = ["json"] }
prometheus-parse = "0.2.5"
time = { version = "0.3", features = ["formatting"] }
async_fn_traits = "0.1.1"
dunce = "1.0.5"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"
dirs = "6"
fake = "3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2.4.1"

[lints.clippy]
unwrap_used = "warn"
